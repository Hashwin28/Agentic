<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT AEGIS // Autonomous Banking SRE Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #070A12; color: #F3F4F6; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen p-6 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, AreaChart, Area, ReferenceLine } = Recharts;

    function AegisDashboard() {
      const [telemetryHistory, setTelemetryHistory] = useState([]);
      const [status, setStatus] = useState('NOMINAL');
      const [events, setEvents] = useState([]);

      const fetchData = () => {
        const now = new Date().toLocaleTimeString();
        const qDepth = Math.floor(Math.random() * 25) + 5;
        const tOcc = Math.floor(Math.random() * 30) + 15;
        const dbSat = Math.floor(Math.random() * 20) + 10;
        const residualNorm = status === 'ANOMALY_DETECTED' ? 18.45 : (Math.random() * 3.5 + 0.5);

        setTelemetryHistory(prev => [...prev.slice(-19), { time: now, qDepth, tOcc, dbSat, residualNorm }]);
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 1000);
        return () => clearInterval(interval);
      }, [status]);

      const triggerStorm = (name) => {
        setStatus('ANOMALY_DETECTED');
        setEvents(prev => [{ timestamp: new Date().toISOString(), agent: 'PRIME', severity: 'error', message: `ANOMALY TRIGGERED: ${name}` }, ...prev]);
        setTimeout(() => setStatus('REMEDIATING'), 1500);
        setTimeout(() => setStatus('RECOVERED'), 3500);
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          <header className="flex justify-between items-center bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/50 flex items-center justify-center text-purple-400 font-bold text-xl">🛡️</div>
              <div>
                <h1 className="text-xl font-bold text-white flex items-center gap-2">
                  PROJECT AEGIS <span className="text-xs font-mono text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800">// SRE Command Center</span>
                </h1>
                <p className="text-xs text-slate-400 font-mono">Hyper-Agentic BFSI Resilience Grid over NitroStack MCP</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span className="text-emerald-400">NitroStack Live MCP</span>
              </div>
              <div className="px-3 py-1.5 rounded-lg text-xs font-bold font-mono border bg-emerald-950/80 border-emerald-500/50 text-emerald-400">● {status}</div>
            </div>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <button onClick={() => triggerStorm('Salary Day Storm')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left font-bold text-sm text-white">Salary Day Storm ⚡</button>
            <button onClick={() => triggerStorm('P2P Transfer Surge')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left font-bold text-sm text-white">P2P Transfer Surge 💸</button>
            <button onClick={() => triggerStorm('EOD Batch Collision')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left font-bold text-sm text-white">EOD Batch Collision 📦</button>
            <button onClick={() => triggerStorm('Mule Ring Isolation')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left font-bold text-sm text-white">Isolate Mule Ring 🔒</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 h-64">
              <h3 className="text-sm font-bold text-white font-mono mb-2">4D Telemetry Stream</h3>
              <ResponsiveContainer width="100%" height="80%">
                <LineChart data={telemetryHistory}>
                  <XAxis dataKey="time" stroke="#475569" tick={{ fontSize: 10 }} />
                  <YAxis stroke="#475569" tick={{ fontSize: 10 }} />
                  <Line type="monotone" dataKey="qDepth" stroke="#06B6D4" strokeWidth={2} dot={false} />
                  <Line type="monotone" dataKey="tOcc" stroke="#8B5CF6" strokeWidth={2} dot={false} />
                </LineChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 h-64">
              <h3 className="text-sm font-bold text-white font-mono mb-2">SVD Residual Error Norm</h3>
              <ResponsiveContainer width="100%" height="80%">
                <AreaChart data={telemetryHistory}>
                  <XAxis dataKey="time" stroke="#475569" tick={{ fontSize: 10 }} />
                  <YAxis stroke="#475569" tick={{ fontSize: 10 }} domain={[0, 25]} />
                  <ReferenceLine y={15} stroke="#EF4444" strokeDasharray="3 3" />
                  <Area type="monotone" dataKey="residualNorm" stroke="#EF4444" fill="rgba(239, 68, 68, 0.2)" strokeWidth={2} />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.render(<AegisDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
