<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT AEGIS // Autonomous Banking SRE Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #070A12; color: #F3F4F6; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glow-cyan { text-shadow: 0 0 12px rgba(6, 182, 212, 0.6); }
    .glow-purple { text-shadow: 0 0 12px rgba(139, 92, 246, 0.6); }
    .box-glow { box-shadow: 0 0 25px -5px rgba(139, 92, 246, 0.25); }
  </style>
</head>
<body class="min-h-screen p-6 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, AreaChart, Area, ReferenceLine } = Recharts;

    function AegisDashboard() {
      const [telemetryHistory, setTelemetryHistory] = useState([]);
      const [currentData, setCurrentData] = useState(null);
      const [events, setEvents] = useState([]);
      const [status, setStatus] = useState('NOMINAL');
      const [simMode, setSimMode] = useState('mock');
      const [rcaModalOpen, setRcaModalOpen] = useState(false);

      const fetchData = async () => {
        try {
          // Fetch telemetry & swarm logs from server endpoints or simulation
          const now = new Date().toLocaleTimeString();
          const qDepth = Math.floor(Math.random() * 25) + 5;
          const tOcc = Math.floor(Math.random() * 30) + 15;
          const dbSat = Math.floor(Math.random() * 20) + 10;
          const retryRate = Math.floor(Math.random() * 5);
          const residualNorm = status === 'ANOMALY_DETECTED' ? 18.45 : (Math.random() * 3.5 + 0.5);

          const newPoint = { time: now, qDepth, tOcc, dbSat, retryRate, residualNorm };

          setTelemetryHistory(prev => [...prev.slice(-19), newPoint]);
          setCurrentData(newPoint);
        } catch (e) {}
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 1000);
        return () => clearInterval(interval);
      }, [status]);

      const triggerStorm = async (endpoint, name) => {
        setStatus('ANOMALY_DETECTED');
        setEvents(prev => [{
          timestamp: new Date().toISOString(),
          agent: 'PRIME',
          severity: 'error',
          message: `ANOMALY TRIGGERED: ${name} — SVD residual breached 15.0 threshold.`
        }, ...prev]);

        setTimeout(() => {
          setStatus('REMEDIATING');
          setEvents(prev => [{
            timestamp: new Date().toISOString(),
            agent: 'ATLAS',
            severity: 'warn',
            message: 'SingleFlightGate & QoS Shunting activated.'
          }, ...prev]);
        }, 1500);

        setTimeout(() => {
          setStatus('RECOVERED');
          setEvents(prev => [{
            timestamp: new Date().toISOString(),
            agent: 'HERMES',
            severity: 'success',
            message: 'RCA filed & teller broadcast sent. System returned to NOMINAL.'
          }, ...prev]);
        }, 3500);
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="flex flex-wrap justify-between items-center bg-slate-900/80 p-5 rounded-2xl border border-slate-800 backdrop-blur-lg">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/50 flex items-center justify-center text-purple-400 font-bold text-xl">
                🛡️
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  PROJECT AEGIS <span className="text-xs font-mono text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800">// Autonomous Banking SRE</span>
                </h1>
                <p className="text-xs text-slate-400 font-mono">Hyper-Agentic BFSI Resilience Grid over NitroStack MCP</p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span className="text-emerald-400">NitroStack Live MCP</span>
              </div>

              <div className={`px-3 py-1.5 rounded-lg text-xs font-bold font-mono border ${
                status === 'NOMINAL' ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-400' :
                status === 'ANOMALY_DETECTED' ? 'bg-amber-950/80 border-amber-500/50 text-amber-400' :
                status === 'REMEDIATING' ? 'bg-purple-950/80 border-purple-500/50 text-purple-400' :
                'bg-cyan-950/80 border-cyan-500/50 text-cyan-400'
              }`}>
                ● {status}
              </div>
            </div>
          </header>

          {/* Autonomous Remediation Banner */}
          {status !== 'NOMINAL' && (
            <div className="bg-red-950/80 border border-red-500/50 p-4 rounded-xl flex items-center justify-between animate-pulse">
              <div className="flex items-center gap-3">
                <span className="text-2xl">🚨</span>
                <div>
                  <h3 className="text-sm font-bold text-red-200 font-mono">PRIME Orchestrator: Autonomous SRE Cascade Active</h3>
                  <p className="text-xs text-red-300">SVD Residual Norm breached 15.0. Staged remediation: ATLAS → CERBERUS → HERMES.</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setStatus('NOMINAL')} className="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded text-xs font-mono font-bold">
                  Reset State
                </button>
              </div>
            </div>
          )}

          {/* Stress Injection Triggers */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <button onClick={() => triggerStorm('/simulate/salary-day', 'Salary Day Storm')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left transition group">
              <div className="text-xs text-cyan-400 font-mono mb-1">STRESS SIMULATION #1</div>
              <div className="font-bold text-sm text-white group-hover:text-cyan-300">Salary Day Storm ⚡</div>
              <div className="text-xs text-slate-400 mt-1">Thundering herd 500+ read spike</div>
            </button>

            <button onClick={() => triggerStorm('/simulate/p2p-surge', 'P2P Transfer Surge')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left transition group">
              <div className="text-xs text-purple-400 font-mono mb-1">STRESS SIMULATION #2</div>
              <div className="font-bold text-sm text-white group-hover:text-purple-300">P2P Transfer Surge 💸</div>
              <div className="text-xs text-slate-400 mt-1">Write contention & idempotency check</div>
            </button>

            <button onClick={() => triggerStorm('/simulate/eod-batch', 'EOD Batch Collision')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left transition group">
              <div className="text-xs text-amber-400 font-mono mb-1">STRESS SIMULATION #3</div>
              <div className="font-bold text-sm text-white group-hover:text-amber-300">EOD Batch Collision 📦</div>
              <div className="text-xs text-slate-400 mt-1">QoS shunting & CPU throttle to 10%</div>
            </button>

            <button onClick={() => triggerStorm('/simulate/mule-ring', 'Mule Ring Isolation')} className="bg-slate-900/60 hover:bg-slate-800 p-4 rounded-xl border border-slate-800 text-left transition group">
              <div className="text-xs text-red-400 font-mono mb-1">SECURITY ACTION</div>
              <div className="font-bold text-sm text-white group-hover:text-red-300">Isolate Mule Ring 🔒</div>
              <div className="text-xs text-slate-400 mt-1">CERBERUS graph cluster isolation</div>
            </button>
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* 4D Telemetry Stream */}
            <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-white font-mono">4D Telemetry Stream</h3>
                <span className="text-xs text-slate-400 font-mono">Live Subspace Vector</span>
              </div>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={telemetryHistory}>
                    <XAxis dataKey="time" stroke="#475569" tick={{ fontSize: 10 }} />
                    <YAxis stroke="#475569" tick={{ fontSize: 10 }} />
                    <Tooltip contentStyle={{ backgroundColor: '#0F172A', borderColor: '#334155' }} />
                    <Line type="monotone" dataKey="qDepth" stroke="#06B6D4" strokeWidth={2} name="Queue Depth" dot={false} />
                    <Line type="monotone" dataKey="tOcc" stroke="#8B5CF6" strokeWidth={2} name="Thread Occupancy" dot={false} />
                    <Line type="monotone" dataKey="dbSat" stroke="#F59E0B" strokeWidth={2} name="DB Saturation" dot={false} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* SVD Residual Norm */}
            <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-white font-mono">Incremental SVD Residual Norm</h3>
                <span className="text-xs text-red-400 font-mono">Threshold: 15.0</span>
              </div>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={telemetryHistory}>
                    <XAxis dataKey="time" stroke="#475569" tick={{ fontSize: 10 }} />
                    <YAxis stroke="#475569" tick={{ fontSize: 10 }} domain={[0, 25]} />
                    <Tooltip contentStyle={{ backgroundColor: '#0F172A', borderColor: '#334155' }} />
                    <ReferenceLine y={15} stroke="#EF4444" strokeDasharray="3 3" label={{ value: '15.0 Threshold', fill: '#EF4444', fontSize: 10 }} />
                    <Area type="monotone" dataKey="residualNorm" stroke="#EF4444" fill="rgba(239, 68, 68, 0.2)" strokeWidth={2} name="SVD Norm" />
                  </AreaChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          {/* Autonomic Shields Grid */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 font-mono">ATLAS SHIELD</div>
                <div className="text-sm font-bold text-white">SingleFlightGate</div>
              </div>
              <span className="px-2 py-1 bg-emerald-950 border border-emerald-500/40 text-emerald-400 text-xs rounded font-mono">ACTIVE</span>
            </div>

            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 font-mono">CERBERUS SHIELD</div>
                <div className="text-sm font-bold text-white">IdempotencyEnforcer</div>
              </div>
              <span className="px-2 py-1 bg-emerald-950 border border-emerald-500/40 text-emerald-400 text-xs rounded font-mono">ACTIVE</span>
            </div>

            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 font-mono">ATLAS SHIELD</div>
                <div className="text-sm font-bold text-white">QosShunting</div>
              </div>
              <span className="px-2 py-1 bg-emerald-950 border border-emerald-500/40 text-emerald-400 text-xs rounded font-mono">ACTIVE</span>
            </div>

            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400 font-mono">PRIME SHIELD</div>
                <div className="text-sm font-bold text-white">ConsensusArbitrator</div>
              </div>
              <span className="px-2 py-1 bg-purple-950 border border-purple-500/40 text-purple-400 text-xs rounded font-mono">READY</span>
            </div>
          </div>

          {/* Swarm Console */}
          <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 font-mono">
            <div className="flex justify-between items-center mb-3">
              <div className="flex items-center gap-2 text-xs text-slate-400">
                <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                <span>AGENTIC SWARM LOG TERMINAL</span>
              </div>
              <button onClick={() => setRcaModalOpen(true)} className="text-xs text-purple-400 hover:text-purple-300 underline">
                View SOC2 RCA Audit Log
              </button>
            </div>
            <div className="h-40 overflow-y-auto space-y-1.5 text-xs text-slate-300 pr-2">
              <div className="text-slate-500">[SYSTEM] Project Aegis Hyper-Agentic Swarm initialized over NitroStack MCP.</div>
              <div className="text-emerald-400">[PRIME] Registered 5 Swarm Agents: PRIME, ATLAS, CERBERUS, LIBRAN, HERMES.</div>
              <div className="text-cyan-400">[LIBRAN] Micro-reconciliation scanner online. 0 orphan transactions detected.</div>
              {events.map((ev, i) => (
                <div key={i} className={ev.severity === 'error' ? 'text-red-400' : ev.severity === 'warn' ? 'text-amber-300' : 'text-emerald-400'}>
                  [{ev.agent}] {ev.message}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<AegisDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
